name: Pin SaplingOS auditor Cargo resolution

# One-shot branch-scoped lockfile generator. The only write allowed is a
# fast-forward commit of Cargo.lock on the named research branch. This job
# runs Cargo dependency resolution only; no downloaded build scripts execute.
on:
  push:
    branches:
      - research/sapling-bundle-entitlements-2026-10-22
    paths:
      - .github/workflows/pin-sapling-auditor-lock.yml

permissions:
  contents: write

jobs:
  pin-lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/sapling-bundle-entitlements-2026-10-22
          persist-credentials: true
      - name: Install pinned toolchain
        run: rustup show
      - name: Resolve precise transitive Rust dependencies without compiling code
        run: |
          cargo generate-lockfile --manifest-path contrib/sapling-vtxo-entitlements/Cargo.toml
          test -s contrib/sapling-vtxo-entitlements/Cargo.lock
          grep -q 'name = "sapling-sdk"' contrib/sapling-vtxo-entitlements/Cargo.lock
      - name: Commit Cargo.lock only to this research branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contrib/sapling-vtxo-entitlements/Cargo.lock
          if git diff --cached --quiet; then
            echo 'Cargo.lock already committed'
            exit 0
          fi
          git commit -m 'Pin complete SaplingOS recovery auditor dependency graph'
          git push origin HEAD:refs/heads/research/sapling-bundle-entitlements-2026-10-22
