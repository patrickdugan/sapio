name: SaplingOS genuine common-root recovery on disposable regtest

# Heavy opt-in-by-PR experiment: builds pinned Ark, TEE and CLN services,
# then destroys both Ark and Sapio signers before publishing recovered claims.
# All wallets, keys and coins are generated for a new disposable regtest.
on:
  pull_request:
    paths:
      - ".github/workflows/sapling-real-common-root.yml"
      - "contrib/sapling-vtxo-entitlements/e2e/**"
      - "contrib/sapling-vtxo-entitlements/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sapling-real-common-root-pr2
  cancel-in-progress: true

jobs:
  actual-service-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 135
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      # Line tables keep panic backtraces readable while shrinking the
      # cached debug targets of the TEE and the pinned SDK test suite.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Recover build space before two pinned Rust service builds
        run: |
          set -euo pipefail
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/julia* \
            2>/dev/null || true
          df -h /

      # Pinned sources and their build outputs only. Keys change with the
      # pins in the bootstrap scripts; no regtest datadir, wallet seed or
      # signed export lives under this path.
      - name: Restore pinned fixture builds
        id: fixture-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sapling-recovery-cache
          key: sapling-real-${{ hashFiles('contrib/sapling-vtxo-entitlements/scripts/bootstrap_*.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sapling-real-${{ hashFiles('contrib/sapling-vtxo-entitlements/scripts/bootstrap_*.sh') }}-

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install native Bark, Bitcoin, CLN and PostgreSQL build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git ca-certificates curl jq python3 pkg-config clang libclang-dev \
            libssl-dev libsqlite3-dev libpq-dev protobuf-compiler cmake \
            libboost-all-dev postgresql-16 postgresql-client-16 wabt
          df -h /

      # utoipa-swagger-ui 9.0.2 downloads v5.17.14 in its build.rs. A curl
      # subprocess inside pinned Nix shells can link the host libc against
      # the Nix glibc and fail. Stage the immutable tagged commit outside Nix
      # and let the crate's supported file:// path consume it without curl.
      - name: Stage pinned Swagger UI archive outside Nix
        run: |
          set -euo pipefail
          SWAGGER_COMMIT=74ed0adebfc9c8dd0de2bf8e81495b022a66c083
          archive="$RUNNER_TEMP/swagger-ui-${SWAGGER_COMMIT}.zip"
          env -u LD_LIBRARY_PATH -u LD_PRELOAD /usr/bin/curl \
            --proto '=https' --tlsv1.2 --retry 3 --fail --location \
            --silent --show-error \
            "https://github.com/swagger-api/swagger-ui/archive/${SWAGGER_COMMIT}.zip" \
            --output "$archive"
          python3 - "$archive" <<'PY'
          from pathlib import Path
          import sys
          from zipfile import ZipFile
          path = Path(sys.argv[1])
          with ZipFile(path) as archive:
              entries = archive.namelist()
              assert len([p for p in entries if p.endswith(
                  "/dist/swagger-initializer.js")]) == 1, "wrong Swagger UI archive"
              assert archive.testzip() is None, "corrupted Swagger UI archive"
          PY
          sha256sum "$archive"
          echo "SWAGGER_UI_DOWNLOAD_URL=file://$archive" >> "$GITHUB_ENV"

      - name: Compile pinned service binaries and exercise real regtest recovery
        id: regtest
        run: |
          set -euo pipefail
          # Keep the whole stage log on the runner for failure annotations.
          exec > >(tee -a "$RUNNER_TEMP/real-regtest.log") 2>&1
          export XDG_CACHE_HOME="$RUNNER_TEMP/sapling-recovery-cache"
          export SAPLING_TEE_SOURCE_DIR="$XDG_CACHE_HOME/sapio_tee-f083bdbd2343aad22fab861f1565c0f2c2e6b0af"
          export SAPLING_FIXTURE_TOOLS_DIR="$XDG_CACHE_HOME/fixture-tools"
          export SAPLING_TWO_HOLDER_CAPTURE_DIR="$RUNNER_TEMP/signed-regtest-recovery"
          export SAPLING_TWO_HOLDER_TARGET_DIR="$XDG_CACHE_HOME/auditor-target"
          df -h /
          du -sh "$XDG_CACHE_HOME" 2>/dev/null || echo "no restored fixture cache"

          echo "==> stage: bootstrap-tee (pinned Sapio TEE build)"
          bash contrib/sapling-vtxo-entitlements/scripts/bootstrap_localdev_tee.sh --build-only \
            | tee "$RUNNER_TEMP/tee-exports.log"
          source <(grep '^export ' "$RUNNER_TEMP/tee-exports.log")

          echo "==> stage: bootstrap-fixtures (Core, CLN, Bark, hold)"
          bash contrib/sapling-vtxo-entitlements/scripts/bootstrap_regtest_fixtures.sh \
            | tee "$RUNNER_TEMP/service-exports.log"
          source <(grep '^export ' "$RUNNER_TEMP/service-exports.log")

          # Prove the nested pinned Nix shell still sees the staged artifact
          # before spending time compiling the SaplingOS integration binary.
          echo "==> stage: nix-shell-swagger-check"
          nix develop --no-update-lock-file "$SAPLINGOS_CHECKOUT" -c bash -ceu '
            [[ "${SWAGGER_UI_DOWNLOAD_URL:-}" == file:///* ]]
            test -r "${SWAGGER_UI_DOWNLOAD_URL#file://}"
          '

          # The pinned SaplingOS e2e suite starts fresh test instances itself.
          # The external wallets and signers are stopped before recovery replay.
          # Its build outputs are cached; its regtest datadirs are not.
          export CARGO_TARGET_DIR="$XDG_CACHE_HOME/saplingos-e2e-target"
          export TEST_DIRECTORY="$RUNNER_TEMP/saplingos-e2e-datadirs"
          bash contrib/sapling-vtxo-entitlements/scripts/run_real_two_holder.sh \
            sapio_real_common_anchor_two_holder_recovery
          test -s "$SAPLING_TWO_HOLDER_CAPTURE_DIR/two-holder-pre-spend-report.json"
          test -s "$SAPLING_TWO_HOLDER_CAPTURE_DIR/two-holder-redemptions.json"
          echo "==> stage: complete"

      # Publish only public regtest txids, heights, amounts and SHA-256s.
      # Never upload the signed bundles, terms, wallet seeds, RPC cookies or
      # service logs. The proof is also echoed as annotations, which the
      # REST API serves without authentication.
      - name: Independently validate capture and write public proof
        env:
          CAPTURE: ${{ runner.temp }}/signed-regtest-recovery
        run: |
          set -euo pipefail
          python3 contrib/sapling-vtxo-entitlements/scripts/write_public_proof.py \
            "$CAPTURE" public-regtest-proof.json \
            --revision sdk_revision=b45e5ef7b9c151cfc18f0efd9f4fee9327e1a29d \
            --revision tee_revision=f083bdbd2343aad22fab861f1565c0f2c2e6b0af \
            --revision bark_revision=626c9b241dd25d73212915d8fca959ab5e3b8f1f \
            --revision source_commit="$GITHUB_SHA" \
            --revision workflow_run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          sha256sum public-regtest-proof.json
          python3 - <<'PY'
          import json, os
          text = open("public-regtest-proof.json", encoding="utf-8").read()
          compact = json.dumps(json.loads(text), sort_keys=True, separators=(",", ":"))
          parts = [compact[i:i + 3500] for i in range(0, len(compact), 3500)]
          for n, part in enumerate(parts, 1):
              print(f"::notice title=public-regtest-proof {n}/{len(parts)}::" + part.replace("%", "%25"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("## Public regtest proof\n\n```json\n" + text + "```\n")
          PY

      - name: Preserve only non-secret regtest proof receipt
        uses: actions/upload-artifact@v4
        with:
          name: saplingos-real-common-root-regtest-proof
          path: public-regtest-proof.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish failure stage and panics as annotations
        if: failure()
        run: |
          python3 contrib/sapling-vtxo-entitlements/scripts/summarize_ci_failure.py \
            "$RUNNER_TEMP/real-regtest.log" || true

      - name: Measure fixture cache before saving
        if: always() && steps.regtest.outcome != 'skipped'
        run: |
          rm -rf "$RUNNER_TEMP/saplingos-e2e-datadirs"
          du -sh "$RUNNER_TEMP"/sapling-recovery-cache/* 2>/dev/null || true
          df -h /

      - name: Save pinned fixture builds
        if: always() && steps.regtest.outcome != 'skipped'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/sapling-recovery-cache
          key: ${{ steps.fixture-cache.outputs.cache-primary-key }}
